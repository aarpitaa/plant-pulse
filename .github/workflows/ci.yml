name: PlantPulse CI/CD Pipeline

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/plantpulse

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─── Stage 1: Lint & Type-check ─────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm -r run typecheck

      - name: ESLint
        run: pnpm -r run lint --if-present

      - name: Python lint (ruff)
        uses: astral-sh/ruff-action@v1
        with:
          src: services/

  # ─── Stage 2: Test ───────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-24.04
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: plantpulse_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/plantpulse_test
        run: pnpm --filter @workspace/db run push

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/plantpulse_test
          NODE_ENV: test
        run: pnpm -r run test --if-present

      - name: Python tests
        run: |
          pip install pytest pytest-asyncio asyncpg aiokafka pydantic
          pytest services/ -v --tb=short

  # ─── Stage 3: Security scan ───────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ─── Stage 4: Build & Push images ────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-24.04
    needs: [test, security]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-server
            context: artifacts/api-server
          - name: operations-ui
            context: artifacts/operations-ui
          - name: equipment-simulator
            context: services/equipment-simulator
          - name: ingestion-service
            context: services/ingestion-service
          - name: health-processor
            context: services/health-processor
          - name: reliability-controller
            context: services/reliability-controller
          - name: incident-api
            context: services/incident-api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Stage 5: Deploy to staging ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.plantpulse.internal

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14'

      - name: Configure kubectl (staging)
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Helm upgrade (staging)
        run: |
          helm upgrade --install plantpulse ./infrastructure/helm/plantpulse \
            --namespace plantpulse-staging \
            --create-namespace \
            --values ./infrastructure/helm/plantpulse/values.yaml \
            --values ./infrastructure/helm/plantpulse/values-staging.yaml \
            --set global.imagePullPolicy=Always \
            --atomic \
            --timeout 5m \
            --wait

      - name: Run smoke tests
        run: |
          kubectl rollout status deployment/plantpulse-api-server -n plantpulse-staging --timeout=120s
          curl -sf https://staging.plantpulse.internal/api/healthz

  # ─── Stage 6: Canary deploy to production ─────────────────────────────────────
  deploy-canary:
    name: Deploy Canary (10%)
    runs-on: ubuntu-24.04
    needs: deploy-staging
    environment:
      name: production-canary
      url: https://plantpulse.internal

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: '3.14'

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Helm canary deploy
        run: |
          helm upgrade --install plantpulse-canary ./infrastructure/helm/plantpulse \
            --namespace plantpulse-prod \
            --values ./infrastructure/helm/plantpulse/values.yaml \
            --values ./infrastructure/helm/plantpulse/values-prod.yaml \
            --set apiServer.replicas=1 \
            --set global.imagePullPolicy=Always \
            --atomic \
            --timeout 5m

      - name: Monitor canary error rate (5 minutes)
        run: |
          echo "Monitoring canary for 5 minutes..."
          for i in $(seq 1 30); do
            CANARY_ERR=$(curl -sf "https://prometheus.plantpulse.internal/api/v1/query?query=rate(http_requests_total{status=~'5..',deployment='canary'}[1m])" | jq '.data.result[0].value[1]' -r)
            echo "Canary error rate: ${CANARY_ERR:-0}"
            if [ "${CANARY_ERR:-0}" != "0" ] && (( $(echo "${CANARY_ERR:-0} > 0.05" | bc -l) )); then
              echo "ERROR: Canary error rate > 5%, triggering rollback"
              helm rollback plantpulse-canary -n plantpulse-prod
              exit 1
            fi
            sleep 10
          done

  # ─── Stage 7: Promote to 100% production ─────────────────────────────────────
  deploy-production:
    name: Promote to Production (100%)
    runs-on: ubuntu-24.04
    needs: deploy-canary
    environment:
      name: production
      url: https://plantpulse.internal

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: '3.14'

      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}

      - name: Full production rollout
        run: |
          helm upgrade --install plantpulse ./infrastructure/helm/plantpulse \
            --namespace plantpulse-prod \
            --create-namespace \
            --values ./infrastructure/helm/plantpulse/values.yaml \
            --values ./infrastructure/helm/plantpulse/values-prod.yaml \
            --set global.imagePullPolicy=Always \
            --atomic \
            --timeout 10m \
            --wait

      - name: Remove canary
        run: helm uninstall plantpulse-canary -n plantpulse-prod --ignore-not-found

      - name: Post-deploy verification
        run: |
          kubectl rollout status deployment/plantpulse-api-server -n plantpulse-prod --timeout=120s
          curl -sf https://plantpulse.internal/api/healthz
          echo "Production deployment complete"
