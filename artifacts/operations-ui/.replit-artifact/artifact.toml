kind = "web"
previewPath = "/"
title = "PlantPulse Operations UI"
version = "1.0.0"
id = "artifacts/operations-ui"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25562

[services.development]
run = "pnpm --filter @workspace/operations-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/operations-ui", "run", "build" ]
serve = "static"
publicDir = "artifacts/operations-ui/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25562"
BASE_PATH = "/"
