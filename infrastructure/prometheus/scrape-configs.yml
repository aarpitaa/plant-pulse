# PlantPulse Prometheus scrape configuration
# Mount as configmap: prometheus-scrape-config

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: plantpulse-prod
    region: eastus

# ─── Rule files ───────────────────────────────────────────────────────────────
rule_files:
  - "/etc/prometheus/rules/*.yml"

# ─── Alertmanager ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ─── Scrape configs ───────────────────────────────────────────────────────────
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # PlantPulse API Server
  - job_name: plantpulse-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [plantpulse-prod]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

  # Kafka (Strimzi) metrics
  - job_name: kafka
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [plantpulse-prod]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_strimzi_io_kind]
        action: keep
        regex: Kafka

  # PostgreSQL exporter
  - job_name: postgresql
    static_configs:
      - targets: ['postgres-exporter:9187']
    metrics_path: /metrics

  # Node exporters (edge nodes)
  - job_name: edge-nodes
    static_configs:
      - targets:
          - edge-atlanta-01:9100
          - edge-chicago-01:9100
          - edge-houston-01:9100
    relabel_configs:
      - source_labels: [__address__]
        regex: '(edge-[^:]+):.*'
        target_label: plant
        replacement: '$1'

  # Kubernetes control plane
  - job_name: kubernetes-apiservers
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https
