{{- if .Values.apiServer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plantpulse.fullname" . }}-api-server
  labels:
    {{- include "plantpulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
spec:
  replicas: {{ .Values.apiServer.replicas }}
  selector:
    matchLabels:
      {{- include "plantpulse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-server
  template:
    metadata:
      labels:
        {{- include "plantpulse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.apiServer.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "plantpulse.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api-server
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.apiServer.image.repository }}:{{ .Values.apiServer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiServer.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.apiServer.service.port }}"
            - name: NODE_ENV
              value: "{{ .Values.global.environment }}"
            - name: LOG_LEVEL
              value: "{{ .Values.apiServer.env.LOG_LEVEL }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plantpulse-pg-credentials
                  key: connection-string
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiServer.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "plantpulse.fullname" . }}-api-server
  labels:
    {{- include "plantpulse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.apiServer.service.type }}
  ports:
    - port: {{ .Values.apiServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "plantpulse.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
{{- if .Values.apiServer.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "plantpulse.fullname" . }}-api-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "plantpulse.fullname" . }}-api-server
  minReplicas: {{ .Values.apiServer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.apiServer.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.apiServer.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
